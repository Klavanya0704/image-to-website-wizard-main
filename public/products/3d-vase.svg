<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B"/>
        <stop offset="50%" stop-color="#0F172A"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <radialGradient id="spot" cx="50%" cy="40%" r="50%">
        <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="matteVase" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#475569"/>
        <stop offset="40%" stop-color="#1E293B"/>
        <stop offset="100%" stop-color="#0F172A"/>
      </linearGradient>
      <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#38BDF8"/>
        <stop offset="100%" stop-color="#818CF8"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bg)"/>
    <circle cx="300" cy="280" r="260" fill="url(#spot)"/>
    <ellipse cx="300" cy="490" rx="140" ry="24" fill="url(#shadow)"/>
    
    <!-- Geometric 3D Printed Spiral Vase -->
    <g transform="translate(180, 110)">
      <!-- Base & Facets -->
      <path d="M60 360 L180 360 L210 240 L190 120 L150 20 L90 20 L50 120 L30 240 Z" fill="url(#matteVase)" stroke="#64748B" stroke-width="1.5"/>
      <!-- Parametric Spiral Lattice Ribs -->
      <path d="M90 20 Q150 100 210 240 Q180 300 180 360" fill="none" stroke="url(#cyanGlow)" stroke-width="3" opacity="0.85"/>
      <path d="M110 20 Q170 110 190 240 Q160 310 150 360" fill="none" stroke="#94A3B8" stroke-width="2" opacity="0.7"/>
      <path d="M130 20 Q190 120 170 240 Q140 320 120 360" fill="none" stroke="url(#cyanGlow)" stroke-width="2" opacity="0.8"/>
      <path d="M150 20 Q180 140 140 240 Q110 330 90 360" fill="none" stroke="#CBD5E1" stroke-width="2" opacity="0.9"/>
      <path d="M90 20 Q70 120 50 220 Q60 300 60 360" fill="none" stroke="#64748B" stroke-width="2"/>
      <!-- Cross Hex Ribs -->
      <path d="M50 120 L190 120" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>
      <path d="M30 240 L210 240" stroke="#0284C7" stroke-width="1.5" opacity="0.6"/>
      <path d="M40 180 L200 180" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
      <path d="M50 300 L190 300" stroke="#94A3B8" stroke-width="1" opacity="0.5"/>
      <!-- Rim Top -->
      <ellipse cx="120" cy="20" rx="30" ry="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <ellipse cx="120" cy="20" rx="20" ry="5" fill="#020617"/>
    </g>
    <!-- Label Badge -->
    <rect x="30" y="30" rx="8" width="130" height="26" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="95" y="47" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">3D PRINTED PLA</text>
  </svg>