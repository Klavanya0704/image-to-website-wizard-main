<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgAcr" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgAcr)"/>
    <circle cx="300" cy="300" r="230" fill="#6366F1" fill-opacity="0.15"/>
    <ellipse cx="300" cy="510" rx="180" ry="24" fill="#000" fill-opacity="0.6"/>

    <!-- Seamless Cast Acrylic Display Showcase Box -->
    <g transform="translate(120, 120)">
      <!-- High-Gloss Black Acrylic Base -->
      <polygon points="40,320 320,320 360,280 80,280" fill="#020617" stroke="#475569" stroke-width="2"/>
      <polygon points="40,320 40,340 320,340 320,320" fill="#0F172A" stroke="#334155"/>
      <!-- Acrylic Transparent Vitrine Cover -->
      <!-- Back Faces -->
      <polygon points="80,280 80,80 360,80 360,280" fill="#6366F1" fill-opacity="0.05" stroke="#818CF8" stroke-width="1.5"/>
      <!-- Front Faces -->
      <polygon points="40,320 40,120 320,120 320,320" fill="#38BDF8" fill-opacity="0.12" stroke="#BAE6FD" stroke-width="2"/>
      <!-- Top Face -->
      <polygon points="40,120 80,80 360,80 320,120" fill="#BAE6FD" fill-opacity="0.25" stroke="#E0F2FE" stroke-width="2"/>
      <!-- Light Reflection Sheen Diagonals -->
      <line x1="60" y1="300" x2="160" y2="140" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linecap="round"/>
      <line x1="80" y1="300" x2="180" y2="140" stroke="#FFFFFF" stroke-width="1" opacity="0.4" stroke-linecap="round"/>
    </g>
    <rect x="30" y="30" rx="8" width="160" height="26" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1"/>
    <text x="110" y="47" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">OPTICAL CAST ACRYLIC</text>
  </svg>