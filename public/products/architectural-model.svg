<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
    <defs>
      <linearGradient id="bgArchStudio" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <linearGradient id="grayResin" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#94A3B8"/>
        <stop offset="50%" stop-color="#64748B"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
      <radialGradient id="archShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#475569" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#475569" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="600" height="500" fill="url(#bgArchStudio)"/>
    <ellipse cx="300" cy="410" rx="170" ry="24" fill="url(#archShadow)"/>

    <!-- Detailed SLA Resin 3D Printed Architectural Temple Model -->
    <g transform="translate(150, 140)">
      <!-- Tiered Base Plinth & Steps -->
      <polygon points="10,240 290,240 280,260 20,260" fill="#475569" stroke="#334155"/>
      <polygon points="30,225 270,225 260,240 40,240" fill="#64748B" stroke="#475569"/>
      <polygon points="50,210 250,210 240,225 60,225" fill="#94A3B8" stroke="#64748B"/>

      <!-- Colonnade (Classical Pillars Array) -->
      
          <rect x="70" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="68" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="68" y="206" width="14" height="4" fill="#CBD5E1"/>
        
          <rect x="92" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="90" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="90" y="206" width="14" height="4" fill="#CBD5E1"/>
        
          <rect x="114" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="112" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="112" y="206" width="14" height="4" fill="#CBD5E1"/>
        
          <rect x="136" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="134" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="134" y="206" width="14" height="4" fill="#CBD5E1"/>
        
          <rect x="158" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="156" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="156" y="206" width="14" height="4" fill="#CBD5E1"/>
        
          <rect x="180" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="178" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="178" y="206" width="14" height="4" fill="#CBD5E1"/>
        
          <rect x="202" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="200" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="200" y="206" width="14" height="4" fill="#CBD5E1"/>
        
          <rect x="224" y="140" width="10" height="70" rx="2" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
          <rect x="222" y="136" width="14" height="4" fill="#CBD5E1"/>
          <rect x="222" y="206" width="14" height="4" fill="#CBD5E1"/>
        

      <!-- Main Entablature / Architrave -->
      <polygon points="50,136 250,136 240,120 60,120" fill="url(#grayResin)" stroke="#475569"/>
      
      <!-- Tiered Roof & Central Dome / Shikhara Tower -->
      <polygon points="70,120 230,120 210,80 90,80" fill="url(#grayResin)" stroke="#334155"/>
      <polygon points="90,80 210,80 180,40 120,40" fill="url(#grayResin)" stroke="#334155"/>
      <path d="M120 40 Q 150 5 180 40 Z" fill="#CBD5E1" stroke="#475569"/>
      
      <!-- Finial Spire -->
      <line x1="150" y1="5" x2="150" y2="-15" stroke="#E2E8F0" stroke-width="3"/>
      <circle cx="150" cy="-15" r="4" fill="#F8FAFC"/>
