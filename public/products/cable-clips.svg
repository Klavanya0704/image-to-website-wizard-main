<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgClip" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="clipOrange" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FB923C"/>
        <stop offset="100%" stop-color="#EA580C"/>
      </linearGradient>
      <linearGradient id="clipBlack" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#475569"/>
        <stop offset="100%" stop-color="#0F172A"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgClip)"/>
    <circle cx="300" cy="300" r="230" fill="#EA580C" fill-opacity="0.1"/>
    <ellipse cx="300" cy="490" rx="190" ry="26" fill="#000" fill-opacity="0.5"/>

    <!-- Braided USB Cable traversing across -->
    <path d="M50 280 Q 200 400 350 250 T 550 220" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round"/>
    <path d="M50 280 Q 200 400 350 250 T 550 220" fill="none" stroke="#0284C7" stroke-width="14" stroke-dasharray="6,4"/>

    <!-- 3D Printed Cable Clips holding the cable -->
    <!-- Clip 1 (Black Matte) -->
    <g transform="translate(140, 310)">
      <rect x="0" y="0" width="80" height="90" rx="16" fill="url(#clipBlack)" stroke="#64748B" stroke-width="2"/>
      <circle cx="40" cy="35" r="18" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
      <path d="M30 0 L50 0 L50 20 L30 20 Z" fill="#020617"/>
      <!-- 3M Adhesive base -->
      <rect x="5" y="80" width="70" height="8" rx="2" fill="#EF4444"/>
    </g>

    <!-- Clip 2 (Orange PLA) -->
    <g transform="translate(280, 240)">
      <rect x="0" y="0" width="90" height="100" rx="18" fill="url(#clipOrange)" stroke="#FDBA74" stroke-width="2"/>
      <circle cx="45" cy="40" r="20" fill="#020617" stroke="#FDBA74" stroke-width="2"/>
      <path d="M35 0 L55 0 L55 24 L35 24 Z" fill="#020617"/>
      <rect x="8" y="90" width="74" height="8" rx="2" fill="#EF4444"/>
      <!-- Grip texture ribs -->
      <line x1="12" y1="65" x2="78" y2="65" stroke="#C2410C" stroke-width="2"/>
      <line x1="12" y1="75" x2="78" y2="75" stroke="#C2410C" stroke-width="2"/>
    </g>

    <!-- Clip 3 (Dual Slot) -->
    <g transform="translate(420, 180)">
      <rect x="0" y="0" width="110" height="90" rx="16" fill="url(#clipBlack)" stroke="#64748B" stroke-width="2"/>
      <circle cx="35" cy="35" r="16" fill="#020617" stroke="#38BDF8" stroke-width="2"/>
      <circle cx="75" cy="35" r="16" fill="#020617" stroke="#94A3B8" stroke-width="2"/>
      <rect x="10" y="80" width="90" height="8" rx="2" fill="#EF4444"/>
    </g>

    <rect x="30" y="30" rx="8" width="170" height="26" fill="#EA580C" fill-opacity="0.2" stroke="#FB923C" stroke-width="1"/>
    <text x="115" y="47" fill="#FB923C" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">DESK CABLE ORGANIZER</text>
  </svg>