<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgBkt" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="aluSurface" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E2E8F0"/>
        <stop offset="40%" stop-color="#94A3B8"/>
        <stop offset="100%" stop-color="#475569"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgBkt)"/>
    <circle cx="300" cy="300" r="230" fill="#38BDF8" fill-opacity="0.1"/>
    <ellipse cx="300" cy="500" rx="180" ry="26" fill="#000" fill-opacity="0.6"/>

    <!-- Heavy-Duty CNC Milled 90-Degree Structural Bracket -->
    <g transform="translate(150, 150)">
      <!-- L-Bracket Vertical Flange -->
      <polygon points="50,40 120,40 120,240 50,240" fill="url(#aluSurface)" stroke="#CBD5E1" stroke-width="2"/>
      <!-- L-Bracket Horizontal Base -->
      <polygon points="50,240 280,240 280,310 50,310" fill="url(#aluSurface)" stroke="#CBD5E1" stroke-width="2"/>
      <!-- Gusset Reinforcement Web -->
      <polygon points="120,100 240,240 120,240" fill="#64748B" stroke="#94A3B8" stroke-width="2"/>
      <!-- CNC Countersunk Precision Mounting Holes -->
      <circle cx="85" cy="90" r="18" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="85" cy="90" r="10" fill="#020617"/>
      <circle cx="85" cy="180" r="18" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="85" cy="180" r="10" fill="#020617"/>
      <circle cx="170" cy="275" r="18" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="170" cy="275" r="10" fill="#020617"/>
      <circle cx="230" cy="275" r="18" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      <circle cx="230" cy="275" r="10" fill="#020617"/>
      <!-- Chamfer Bevel Edges -->
      <line x1="50" y1="40" x2="60" y2="40" stroke="#F8FAFC" stroke-width="3"/>
      <line x1="280" y1="240" x2="280" y2="250" stroke="#F8FAFC" stroke-width="3"/>
    </g>
    <rect x="30" y="30" rx="8" width="160" height="26" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="110" y="47" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CNC BILLET ALUMINUM</text>
  </svg>