<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgBsh" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F59E0B"/>
        <stop offset="30%" stop-color="#FDE68A"/>
        <stop offset="70%" stop-color="#D97706"/>
        <stop offset="100%" stop-color="#78350F"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgBsh)"/>
    <circle cx="300" cy="300" r="230" fill="#F59E0B" fill-opacity="0.15"/>
    <ellipse cx="300" cy="490" rx="180" ry="26" fill="#000" fill-opacity="0.6"/>

    <!-- Set of 4 Flanged CNC Turned Brass Bushings -->
    <g transform="translate(180, 140)">
      <!-- Main Prominent Bushing -->
      <rect x="60" y="100" width="120" height="180" rx="10" fill="url(#brassGrad)" stroke="#FDE68A" stroke-width="2"/>
      <!-- Flange Top -->
      <ellipse cx="120" cy="100" rx="90" ry="26" fill="url(#brassGrad)" stroke="#FEF3C7" stroke-width="2"/>
      <ellipse cx="120" cy="100" rx="45" ry="14" fill="#451A03" stroke="#FDE68A" stroke-width="2"/>
      <!-- Chamfer Ring -->
      <ellipse cx="120" cy="280" rx="60" ry="18" fill="#B45309"/>
      <ellipse cx="120" cy="275" rx="55" ry="15" fill="#78350F"/>

      <!-- Secondary Small Bushing (Right) -->
      <g transform="translate(130, 140) scale(0.65)">
        <rect x="60" y="100" width="120" height="180" rx="10" fill="url(#brassGrad)" stroke="#FDE68A" stroke-width="2"/>
        <ellipse cx="120" cy="100" rx="90" ry="26" fill="url(#brassGrad)" stroke="#FEF3C7" stroke-width="2"/>
        <ellipse cx="120" cy="100" rx="45" ry="14" fill="#451A03" stroke="#FDE68A" stroke-width="2"/>
      </g>
    </g>
    <rect x="30" y="30" rx="8" width="160" height="26" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1"/>
    <text x="110" y="47" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">PRECISION BRASS 4-PK</text>
  </svg>