<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgCnc" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0F172A"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="anodizedBlue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA"/>
        <stop offset="30%" stop-color="#2563EB"/>
        <stop offset="70%" stop-color="#1D4ED8"/>
        <stop offset="100%" stop-color="#1E3A8A"/>
      </linearGradient>
      <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#94A3B8"/>
        <stop offset="50%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#64748B"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgCnc)"/>
    <circle cx="300" cy="300" r="230" fill="#0284C7" fill-opacity="0.15"/>
    <ellipse cx="300" cy="500" rx="160" ry="24" fill="#000" fill-opacity="0.6"/>

    <!-- 4-Axis CNC Machined Flexible Aluminum Beam Shaft Coupling -->
    <g transform="translate(200, 120)">
      <!-- Outer Cylinder Body -->
      <rect x="0" y="40" width="200" height="280" rx="20" fill="url(#anodizedBlue)" stroke="#93C5FD" stroke-width="2"/>
      <!-- Top Bore Face -->
      <ellipse cx="100" cy="40" rx="100" ry="30" fill="url(#chrome)" stroke="#E2E8F0" stroke-width="2"/>
      <ellipse cx="100" cy="40" rx="40" ry="12" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
      <!-- Spiral CNC Kerf Slits (Helical Flexure) -->
      <path d="M10 110 Q 100 150 190 120" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
      <path d="M10 110 Q 100 150 190 120" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <path d="M10 160 Q 100 200 190 170" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
      <path d="M10 160 Q 100 200 190 170" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <path d="M10 210 Q 100 250 190 220" fill="none" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
      <path d="M10 210 Q 100 250 190 220" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <!-- M3 Socket Head Set Screws -->
      <circle cx="50" cy="75" r="12" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      <polygon points="46,70 54,70 58,75 54,80 46,80 42,75" fill="#020617"/>
      <circle cx="50" cy="275" r="12" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
      <polygon points="46,270 54,270 58,275 54,280 46,280 42,275" fill="#020617"/>
      <!-- Bottom Lip -->
      <path d="M0 300 Q 100 340 200 300 L200 320 Q 100 360 0 320 Z" fill="#1E3A8A"/>
    </g>
    <rect x="30" y="30" rx="8" width="160" height="26" fill="#0284C7" fill-opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
    <text x="110" y="47" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">4-AXIS CNC 6061-T6</text>
  </svg>