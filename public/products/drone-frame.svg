<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgDrn" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E1B4B"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <pattern id="carbonTwill" width="12" height="12" patternUnits="userSpaceOnUse">
        <rect width="6" height="6" fill="#1E293B"/>
        <rect x="6" width="6" height="6" fill="#0F172A"/>
        <rect y="6" width="6" height="6" fill="#0F172A"/>
        <rect x="6" y="6" width="6" height="6" fill="#334155"/>
      </pattern>
    </defs>
    <rect width="600" height="600" fill="url(#bgDrn)"/>
    <circle cx="300" cy="300" r="230" fill="#8B5CF6" fill-opacity="0.15"/>
    <ellipse cx="300" cy="510" rx="180" ry="24" fill="#000" fill-opacity="0.6"/>

    <!-- 5-inch 3K Full Carbon Fiber FPV Drone Frame -->
    <g transform="translate(100, 100)">
      <!-- 4 Quad Arms radiating outwards -->
      <line x1="200" y1="200" x2="40" y2="40" stroke="url(#carbonTwill)" stroke-width="32" stroke-linecap="round"/>
      <line x1="200" y1="200" x2="360" y2="40" stroke="url(#carbonTwill)" stroke-width="32" stroke-linecap="round"/>
      <line x1="200" y1="200" x2="40" y2="360" stroke="url(#carbonTwill)" stroke-width="32" stroke-linecap="round"/>
      <line x1="200" y1="200" x2="360" y2="360" stroke="url(#carbonTwill)" stroke-width="32" stroke-linecap="round"/>

      <!-- Motor Mount Circles on Arm Tips -->
      <circle cx="40" cy="40" r="24" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="40" cy="40" r="10" fill="#020617"/>
      <circle cx="360" cy="40" r="24" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="360" cy="40" r="10" fill="#020617"/>
      <circle cx="40" cy="360" r="24" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="40" cy="360" r="10" fill="#020617"/>
      <circle cx="360" cy="360" r="24" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="360" cy="360" r="10" fill="#020617"/>

      <!-- Center Body Top & Bottom Plates -->
      <polygon points="140,110 260,110 280,290 120,290" fill="url(#carbonTwill)" stroke="#A78BFA" stroke-width="2"/>
      <!-- Red Anodized Aluminum Standoffs -->
      <circle cx="150" cy="130" r="8" fill="#EF4444" stroke="#FCA5A5" stroke-width="2"/>
      <circle cx="250" cy="130" r="8" fill="#EF4444" stroke="#FCA5A5" stroke-width="2"/>
      <circle cx="135" cy="270" r="8" fill="#EF4444" stroke="#FCA5A5" stroke-width="2"/>
      <circle cx="265" cy="270" r="8" fill="#EF4444" stroke="#FCA5A5" stroke-width="2"/>
      <!-- Battery Strap Slots -->
      <rect x="180" y="170" width="40" height="8" rx="3" fill="#020617" stroke="#64748B"/>
      <rect x="180" y="210" width="40" height="8" rx="3" fill="#020617" stroke="#64748B"/>
    </g>
    <rect x="30" y="30" rx="8" width="160" height="26" fill="#7C3AED" fill-opacity="0.2" stroke="#A78BFA" stroke-width="1"/>
    <text x="110" y="47" fill="#A78BFA" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">3K TWILL CARBON FIBER</text>
  </svg>