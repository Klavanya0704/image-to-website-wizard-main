<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgMtr" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E1B4B"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="anodizedPurple" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#A855F7"/>
        <stop offset="30%" stop-color="#6366F1"/>
        <stop offset="70%" stop-color="#4F46E5"/>
        <stop offset="100%" stop-color="#312E81"/>
      </linearGradient>
      <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#EA580C"/>
        <stop offset="50%" stop-color="#FDBA74"/>
        <stop offset="100%" stop-color="#9A3412"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgMtr)"/>
    <circle cx="300" cy="300" r="230" fill="#818CF8" fill-opacity="0.15"/>
    <ellipse cx="300" cy="510" rx="170" ry="24" fill="#000" fill-opacity="0.6"/>

    <!-- 2207 2450KV Brushless FPV Drone Motor -->
    <g transform="translate(180, 110)">
      <!-- Titanium Prop Shaft Top -->
      <rect x="105" y="0" width="30" height="70" rx="3" fill="#CBD5E1" stroke="#F8FAFC" stroke-width="1.5"/>
      <line x1="105" y1="20" x2="135" y2="20" stroke="#64748B" stroke-width="2"/>
      <line x1="105" y1="35" x2="135" y2="35" stroke="#64748B" stroke-width="2"/>
      <!-- Motor Bell Top Cap (Anodized) -->
      <ellipse cx="120" cy="90" rx="100" ry="30" fill="url(#anodizedPurple)" stroke="#C084FC" stroke-width="2"/>
      <!-- Motor Bell Rotor Cylinder with cooling cutouts -->
      <rect x="20" y="90" width="200" height="130" rx="14" fill="url(#anodizedPurple)" stroke="#818CF8" stroke-width="2"/>
      
        <rect x="35" y="115" width="16" height="50" rx="4" fill="#0F172A"/>
      
        <rect x="63" y="115" width="16" height="50" rx="4" fill="#0F172A"/>
      
        <rect x="91" y="115" width="16" height="50" rx="4" fill="#0F172A"/>
      
        <rect x="119" y="115" width="16" height="50" rx="4" fill="#0F172A"/>
      
        <rect x="147" y="115" width="16" height="50" rx="4" fill="#0F172A"/>
      
        <rect x="175" y="115" width="16" height="50" rx="4" fill="#0F172A"/>
      
      <!-- Exposed Copper Stator Windings -->
      <rect x="30" y="210" width="180" height="40" fill="url(#copper)" stroke="#9A3412" stroke-width="1.5"/>
      
        <line x1="35" y1="210" x2="35" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="49" y1="210" x2="49" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="63" y1="210" x2="63" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="77" y1="210" x2="77" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="91" y1="210" x2="91" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="105" y1="210" x2="105" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="119" y1="210" x2="119" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="133" y1="210" x2="133" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="147" y1="210" x2="147" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="161" y1="210" x2="161" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="175" y1="210" x2="175" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
        <line x1="189" y1="210" x2="189" y2="250" stroke="#7C2D12" stroke-width="2"/>
      
      <!-- Stator Base Plate (with M3 mounting holes) -->
      <rect x="40" y="250" width="160" height="30" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
      <!-- Motor Silicone Wires -->
      <path d="M120 280 Q 120 340 50 360" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
      <path d="M130 280 Q 130 345 60 375" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
      <path d="M140 280 Q 140 350 70 390" fill="none" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
    </g>
    <rect x="30" y="30" rx="8" width="170" height="26" fill="#6366F1" fill-opacity="0.2" stroke="#818CF8" stroke-width="1"/>
    <text x="115" y="47" fill="#818CF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">2207 2450KV BRUSHLESS</text>
  </svg>