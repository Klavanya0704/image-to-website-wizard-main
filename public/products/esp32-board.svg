<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgElec" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#022C22"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
      <linearGradient id="pcbMatte" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#064E3B"/>
        <stop offset="50%" stop-color="#022C22"/>
        <stop offset="100%" stop-color="#064E3B"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgElec)"/>
    <circle cx="300" cy="300" r="230" fill="#10B981" fill-opacity="0.15"/>
    <ellipse cx="300" cy="510" rx="170" ry="24" fill="#000" fill-opacity="0.6"/>

    <!-- ESP32 Dual-Core Dev Board -->
    <g transform="translate(175, 100)">
      <!-- PCB Substrate -->
      <rect x="0" y="0" width="250" height="380" rx="14" fill="url(#pcbMatte)" stroke="#059669" stroke-width="2"/>
      <!-- Gold Breakout Header Pins Left & Right -->
      
        <circle cx="15" cy="30" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="15" cy="30" r="2" fill="#020617"/>
        <circle cx="235" cy="30" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="235" cy="30" r="2" fill="#020617"/>
      
