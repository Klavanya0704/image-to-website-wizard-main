        <circle cx="235" cy="162" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="235" cy="162" r="2" fill="#020617"/>
      
        <circle cx="15" cy="184" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="15" cy="184" r="2" fill="#020617"/>
        <circle cx="235" cy="184" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="235" cy="184" r="2" fill="#020617"/>
      
