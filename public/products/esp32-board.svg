        <circle cx="15" cy="316" r="2" fill="#020617"/>
        <circle cx="235" cy="316" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="235" cy="316" r="2" fill="#020617"/>
      
        <circle cx="15" cy="338" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="15" cy="338" r="2" fill="#020617"/>
        <circle cx="235" cy="338" r="6" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="235" cy="338" r="2" fill="#020617"/>
      

      <!-- Metal RF Shield CAN (ESP-WROOM-32D) -->
      <rect x="45" y="30" width="160" height="150" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
      <rect x="60" y="45" width="130" height="40" rx="3" fill="#334155"/>
      <text x="125" y="68" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">ESP-WROOM-32</text>
      <text x="125" y="80" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Wi-Fi + BLE 4.2</text>

      <!-- PCB Meandered Inverted-F Wi-Fi Antenna -->
      <path d="M70 20 L70 10 L180 10 L180 20 L150 20 L150 15 L120 15 L120 20 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>

      <!-- USB Type-C Receptacle -->
      <rect x="90" y="350" width="70" height="30" rx="4" fill="#94A3B8" stroke="#F8FAFC" stroke-width="1.5"/>
      <rect x="105" y="360" width="40" height="12" rx="3" fill="#0F172A"/>

      <!-- CP2102 USB Bridge IC -->
      <rect x="105" y="270" width="40" height="40" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <circle cx="112" cy="277" r="2" fill="#94A3B8"/>

      <!-- Pushbuttons (EN & BOOT) -->
      <rect x="35" y="330" width="24" height="24" rx="3" fill="#475569"/>
      <circle cx="47" cy="342" r="6" fill="#F8FAFC"/>
      <rect x="190" y="330" width="24" height="24" rx="3" fill="#475569"/>
      <circle cx="202" cy="342" r="6" fill="#F8FAFC"/>
    </g>
    <rect x="30" y="30" rx="8" width="160" height="26" fill="#059669" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
    <text x="110" y="47" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ESP32 240MHz DUAL-CORE</text>
  </svg>