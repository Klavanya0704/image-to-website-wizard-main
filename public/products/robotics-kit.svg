<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
    <defs>
      <linearGradient id="bgRob" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1E293B"/>
        <stop offset="100%" stop-color="#0B0F19"/>
      </linearGradient>
    </defs>
    <rect width="600" height="600" fill="url(#bgRob)"/>
    <circle cx="300" cy="300" r="230" fill="#F59E0B" fill-opacity="0.15"/>
    <ellipse cx="300" cy="510" rx="180" ry="24" fill="#000" fill-opacity="0.6"/>

    <!-- 2WD STEM Robotics Car Kit -->
    <g transform="translate(140, 150)">
      <!-- Acrylic Transparent Chassis -->
      <rect x="40" y="40" width="240" height="180" rx="20" fill="#38BDF8" fill-opacity="0.3" stroke="#7DD3FC" stroke-width="3"/>
      <!-- Dual TT Gearbox Motors (Yellow) & Rubber Wheels -->
      <!-- Left Wheel -->
      <rect x="0" y="60" width="35" height="140" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <rect x="8" y="75" width="18" height="110" rx="6" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
      <circle cx="17" cy="130" r="6" fill="#0F172A"/>
      <!-- Right Wheel -->
      <rect x="285" y="60" width="35" height="140" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
      <rect x="293" y="75" width="18" height="110" rx="6" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
      <circle cx="302" cy="130" r="6" fill="#0F172A"/>

      <!-- Ultrasonic Sonar Sensor "Eyes" HC-SR04 -->
      <rect x="100" y="10" width="120" height="50" rx="8" fill="#3B82F6" stroke="#93C5FD" stroke-width="2"/>
      <circle cx="130" cy="35" r="16" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
      <circle cx="130" cy="35" r="8" fill="#475569"/>
      <circle cx="190" cy="35" r="16" fill="#E2E8F0" stroke="#0F172A" stroke-width="3"/>
      <circle cx="190" cy="35" r="8" fill="#475569"/>

      <!-- Microcontroller Shield on Chassis -->
      <rect x="80" y="80" width="160" height="110" rx="8" fill="#047857" stroke="#34D399" stroke-width="2"/>
      <rect x="120" y="100" width="80" height="60" rx="4" fill="#064E3B"/>
      <!-- Battery Pack Holder -->
      <rect x="90" y="200" width="140" height="40" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    </g>
    <rect x="30" y="30" rx="8" width="170" height="26" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24" stroke-width="1"/>
    <text x="115" y="47" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AUTONOMOUS STEM ROBOT</text>
  </svg>